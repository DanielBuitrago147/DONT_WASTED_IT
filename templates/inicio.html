<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DON'T WASTE IT - Rescata Alimentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #2ecc71; --primary-blue: #007bff; --text-dark: #1a1d23; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: var(--text-dark); margin: 0; }
        
        /* Hero Section */
        .hero-section {
            padding: 100px 0;
            background: linear-gradient(135deg, #f4f7f6 0%, #e8f5e9 100%);
            min-height: 90vh;
            display: flex;
            align-items: center;
        }
        .brand-badge {
            background: rgba(46, 204, 113, 0.1);
            color: var(--primary-green);
            padding: 8px 20px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 20px;
        }
        h1 { font-size: 4rem; font-weight: 800; line-height: 1.1; margin-bottom: 25px; }
        .text-gradient { background: linear-gradient(135deg, #2ecc71, #27ae60); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-main { padding: 15px 40px; border-radius: 16px; font-weight: 700; transition: 0.3s; font-size: 1.1rem; }
        .btn-success-custom { background-color: var(--primary-green); border: none; color: white; box-shadow: 0 10px 20px rgba(46, 204, 113, 0.2); }
        .btn-success-custom:hover { transform: translateY(-3px); background-color: #27ae60; color: white; }
        
        .btn-outline-custom { border: 2px solid #ddd; color: var(--text-dark); background: white; }
        .btn-outline-custom:hover { background-color: #f8f9fa; border-color: #ccc; }

        .feature-card { padding: 30px; border-radius: 24px; border: 1px solid #eee; background: white; transition: 0.3s; }
        .feature-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        .icon-box { width: 60px; height: 60px; background: #eef9f3; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--primary-green); margin-bottom: 20px; }
    </style>
</head>
<body>
    <section class="hero-section">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6">
                    <div class="brand-badge">🍏 Dont Wasted it</div>
                    <h1>DON´T. <br><span class="text-gradient">WASTED IT.</span></h1>
                    <p class="lead text-muted mb-5 pe-lg-5">Conecta con establecimientos cercanos, encuentra alimentos excedentes a precios increíbles y ayuda a reducir el impacto ambiental.</p>
                    <div class="d-flex gap-3">
                        <a href="/registro" class="btn btn-main btn-success-custom">Crear cuenta</a>
                        <a href="/login" class="btn btn-main btn-outline-custom">Iniciar sesión</a>
                    </div>
                </div>
                <div class="col-lg-6 mt-5 mt-lg-0">
                    <div class="row g-4">
                        <div class="col-6">
                            <div class="feature-card shadow-sm">
                                <div class="icon-box"><i class="bi bi-geo-alt"></i></div>
                                <h5 class="fw-bold">Cerca de ti</h5>
                                <p class="small text-muted m-0">Encuentra ofertas en tu zona al instante.</p>
                            </div>
                        </div>
                        <div class="col-6 mt-5">
                            <div class="feature-card shadow-sm">
                                <div class="icon-box"><i class="bi bi-shield-check"></i></div>
                                <h5 class="fw-bold">Calidad</h5>
                                <p class="small text-muted m-0">Alimentos aptos y verificados.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
