<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DON'T WASTE IT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #f4f7f6 0%, #e3f2fd 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .back-arrow { position: fixed; top: 30px; left: 30px; color: #2c3e50; text-decoration: none; font-weight: 700; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .back-arrow:hover { color: #007bff; transform: translateX(-5px); }
        .card-auth { width: 100%; max-width: 420px; background: white; border-radius: 30px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.05); padding: 45px; }
        .btn-login { background-color: #007bff; border: none; color: white; padding: 14px; border-radius: 16px; font-weight: 700; width: 100%; margin-top: 10px; transition: 0.3s; }
        .btn-login:hover { background-color: #0056b3; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 123, 255, 0.2); }
        .form-control { border-radius: 14px; padding: 12px 18px; border: 1px solid #eee; background-color: #fcfdfe; }
    </style>
</head>
<body>
    <a href="/" class="back-arrow"><i class="bi bi-arrow-left"></i> Volver</a>
    <div class="card card-auth">
        <div class="text-center mb-4">
            <div class="h2 fw-bold text-dark m-0">Bienvenido</div>
            <p class="text-muted small">Ingresa para continuar salvando comida</p>
        </div>
        {% with messages = get_flashed_messages() %}{% if messages %}{% for m in messages %}<div class="alert alert-danger p-2 small border-0 rounded-3">{{ m }}</div>{% endfor %}{% endif %}{% endwith %}
        <form action="/login" method="POST">
            <div class="mb-3"><label class="small fw-bold mb-1">Correo Electrónico</label><input type="email" name="correo" class="form-control" placeholder="nombre@ejemplo.com" required></div>
            <div class="mb-4"><label class="small fw-bold mb-1">Contraseña</label><input type="password" name="clave" class="form-control" placeholder="••••••••" required></div>
            <button type="submit" class="btn btn-login">Entrar al panel</button>
        </form>
        <div class="text-center mt-4"><p class="small text-muted m-0">¿Aún no tienes cuenta? <a href="/registro" class="text-primary fw-bold text-decoration-none">Regístrate</a></p></div>
    </div>
</body>
</html>
